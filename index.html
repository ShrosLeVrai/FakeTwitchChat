function buildMessagePool(){

const set=new Set();



for(const contexte of CONTEXTES){

 for(const reaction of REACTIONS){

 const template =
 TEMPLATES[
 Math.floor(Math.random()*TEMPLATES.length)
 ];


 set.add(
 template(contexte,reaction)
 );


 }

}

 set.add(msg);
 set.add(msg+"!!");
 set.add(msg+"!!!!");

}




const array=[...set];



for(let i=array.length-1;i>0;i--){

 const j=Math.floor(Math.random()*(i+1));

 [array[i],array[j]]=
 [array[j],array[i]];

}



return array;

const FALLBACK_POOL =

/* ==================================
        GENERATION OPENAI
================================== */


const LIVE_POOL = [];

let isFetchingAI = false;


const AI_BATCH_SIZE = 40;

const AI_REFILL_THRESHOLD = 12;



async function fetchAIMessages(n = AI_BATCH_SIZE){


const prompt = `

Tu écris des messages de chat Twitch en direct
pour un streamer Roblox garçon.

Les viewers parlent toujours du streamer avec "il".
N'utilise jamais "elle", "la streameuse" ou des accords féminins.

Génère exactement ${n} messages.

Style obligatoire :

- français
- vrais adolescents Twitch
- messages courts
- réactions naturelles
- fautes volontaires parfois
- majuscules possibles
- argot internet

Exemples de style :

BAHHHH le boss
PTDR le glitch
OMG quel drop
WESH impossible
MDRRR il a raté

Les messages doivent parler de :

- Roblox
- boss
- glitch
- victoire
- fail
- troll
- item rare
- event
- gameplay

Contraintes :

- aucun pseudo
- aucun numéro
- aucune explication
- aucun texte avant ou après
- utiliser uniquement il/lui/son quand on parle du streamer
- le streamer est un garçon
- réactions comme dans un vrai chat Twitch

Réponds uniquement avec un tableau JSON :

["message1","message2"]

`;



try{


const response =
await fetch(
"https://api.openai.com/v1/chat/completions",
{

method:"POST",


headers:{


"Content-Type":"application/json",

"Authorization":
"Bearer "+OPENAI_API_KEY


},


body:JSON.stringify({


model:"gpt-5-mini",


messages:[


{

role:"system",

content:
"Tu génères uniquement des messages Twitch Roblox."


},


{

role:"user",

content:prompt

}


],



temperature:1.2,


max_tokens:1500



})


});




const data =
await response.json();



let raw =
data.choices[0]
.message
.content;



raw =
raw
.replace(/```json/g,"")
.replace(/```/g,"")
.trim();




const messages =
JSON.parse(raw);




if(Array.isArray(messages)){


return messages.filter(

m =>
typeof m==="string"
&&
m.trim().length>0

);


}



}catch(error){



console.error(
"Erreur OpenAI :",
error
);



}



return [];

}





async function refillLivePool(){



if(isFetchingAI)
return;



isFetchingAI=true;



const messages =
await fetchAIMessages(
AI_BATCH_SIZE
);



if(messages.length){


LIVE_POOL.push(
...messages.slice(0,40)
);

// limite de sécurité
if(LIVE_POOL.length > 100){
  LIVE_POOL.splice(0, LIVE_POOL.length - 100);
}


}



isFetchingAI=false;



}





// première génération au lancement

refillLivePool();





function nextMessage(){



// recharge en arrière-plan

if(
LIVE_POOL.length
<=
AI_REFILL_THRESHOLD
){

refillLivePool();

}




if(LIVE_POOL.length>0){


return LIVE_POOL.shift();


}




// secours local

return FALLBACK_POOL[

Math.floor(
Math.random()
*
FALLBACK_POOL.length
)

];


}
/* ==================================
          AFFICHAGE DU CHAT
================================== */


const chatEl =
document.getElementById("chat");


const maxMsg =
parseInt(
getComputedStyle(document.documentElement)
.getPropertyValue("--max-messages")
);





function randomColor(){

return COLORS[
Math.floor(
Math.random()*COLORS.length
)
];

}





function pushMessage(){



const pseudo =
PSEUDOS[
Math.floor(
Math.random()*PSEUDOS.length
)
];



const message =
nextMessage();



const color =
randomColor();




const addEmoji =
Math.random()<0.6;



const emoji =
addEmoji

?

EMOJIS[
Math.floor(
Math.random()*EMOJIS.length
)
]

:null;






const div =
document.createElement("div");



div.className="msg";





const user =
document.createElement("span");



user.className="user";



user.style.color=color;



user.textContent =
pseudo+": ";







const text =
document.createElement("span");



text.className="text";



text.textContent =
message;






div.appendChild(user);

div.appendChild(text);






if(emoji){


const img =
document.createElement("img");



img.className="emoji";



img.src=emoji;



div.appendChild(img);


}






chatEl.appendChild(div);






// suppression des anciens messages


while(chatEl.children.length > maxMsg){


const old =
chatEl.firstChild;



old.classList.add("fadeout");



setTimeout(()=>{


old.remove();


},400);



break;


}



}






/* ==================================
      SYSTEME DE CHAT NATUREL
================================== */


function sleep(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
}



async function chatLoop(){


while(true){


    // Groupe de 3 messages rapides

    let rapide =
    3 + Math.floor(Math.random()*2);


    for(let i = 0; i < rapide; i++){

        pushMessage();


        // entre 0.08 et 0.18 seconde
        await sleep(
            80 + Math.random()*100
        );

    }



    // pause naturelle

    await sleep(
        3000 + Math.random()*2000
    );



    // gros moment de spam Twitch

    let spam =
    5 + Math.floor(Math.random()*3);



    for(let i = 0; i < spam; i++){


        pushMessage();


        // certains messages arrivent légèrement décalés

        await sleep(
            50 + Math.random()*150
        );


    }



    // pause avant prochaine vague

    await sleep(
        4000 + Math.random()*5000
    );

}


}


// lancement

chatLoop();
